<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Tianyi Zhang — Reliable AI systems</title>
  <desc id="desc">A dark technical card connecting data, model, and evaluation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8CFF"/>
      <stop offset="1" stop-color="#66D7C5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="24" fill="url(#background)" stroke="#273241" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="396" rx="23" fill="url(#grid)"/>
  <circle cx="1088" cy="55" r="150" fill="#6E8CFF" opacity=".08" filter="url(#glow)"/>
  <circle cx="1010" cy="350" r="130" fill="#66D7C5" opacity=".055" filter="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="66" fill="#8B98A8" font-size="14" font-weight="600" letter-spacing="4">TIANYI ZHANG / ML SYSTEMS</text>
    <rect x="64" y="90" width="52" height="4" rx="2" fill="url(#signal)"/>

    <text x="64" y="164" fill="#F3F7FC" font-size="58" font-weight="700" letter-spacing="-1.5">Reliable AI,</text>
    <text x="64" y="224" fill="#F3F7FC" font-size="58" font-weight="700" letter-spacing="-1.5">end to end.</text>

    <text x="66" y="268" fill="#9AA7B7" font-size="18">representation · retrieval · agent evaluation · post-training</text>

    <g font-size="13" font-weight="600" letter-spacing="1.4">
      <rect x="64" y="307" width="128" height="36" rx="18" fill="#6E8CFF" fill-opacity=".12" stroke="#6E8CFF" stroke-opacity=".45"/>
      <text x="128" y="330" fill="#AEBBFF" text-anchor="middle">ENGINEERING</text>
      <rect x="204" y="307" width="112" height="36" rx="18" fill="#66D7C5" fill-opacity=".10" stroke="#66D7C5" stroke-opacity=".42"/>
      <text x="260" y="330" fill="#9AE7DB" text-anchor="middle">RESEARCH</text>
      <rect x="328" y="307" width="146" height="36" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".15"/>
      <text x="401" y="330" fill="#B8C2CF" text-anchor="middle">OPEN SOURCE</text>
    </g>

    <g transform="translate(620 70)">
      <text x="0" y="0" fill="#667487" font-size="12" font-weight="600" letter-spacing="2.4">PROXY FIDELITY ACROSS THE PIPELINE</text>

      <path d="M62 143 C145 87 204 87 286 143 S426 199 508 143" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
      <path d="M62 143 C145 199 204 199 286 143 S426 87 508 143" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2" stroke-dasharray="5 9"/>

      <g>
        <circle cx="62" cy="143" r="46" fill="#101824" stroke="#6E8CFF" stroke-width="2"/>
        <circle cx="62" cy="143" r="7" fill="#6E8CFF"/>
        <text x="62" y="215" fill="#F0F4FA" font-size="16" font-weight="700" text-anchor="middle">DATA</text>
        <text x="62" y="238" fill="#748295" font-size="12" text-anchor="middle">integrity</text>
      </g>

      <g>
        <circle cx="286" cy="143" r="54" fill="#101824" stroke="#8D9AAC" stroke-width="2"/>
        <circle cx="286" cy="143" r="23" fill="none" stroke="#8D9AAC" stroke-opacity=".55"/>
        <circle cx="286" cy="143" r="7" fill="#E5EBF3"/>
        <text x="286" y="223" fill="#F0F4FA" font-size="16" font-weight="700" text-anchor="middle">MODEL</text>
        <text x="286" y="246" fill="#748295" font-size="12" text-anchor="middle">behavior</text>
      </g>

      <g>
        <circle cx="508" cy="143" r="46" fill="#101824" stroke="#66D7C5" stroke-width="2"/>
        <path d="M493 143l10 10 21-24" fill="none" stroke="#66D7C5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="508" y="215" fill="#F0F4FA" font-size="16" font-weight="700" text-anchor="middle">EVAL</text>
        <text x="508" y="238" fill="#748295" font-size="12" text-anchor="middle">validity</text>
      </g>

      <text x="286" y="304" fill="#617083" font-size="12" text-anchor="middle" letter-spacing="1.5">BUILD · MEASURE · AUDIT</text>
    </g>
  </g>
</svg>
